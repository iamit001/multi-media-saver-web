apiVersion: external-secrets.io/v1 
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://192.168.1.30:8200/"
      path: "tokens/"
      version: "v2"
      auth:
        tokenSecretRef:
          name: "vault-token"
          namespace: "multimediasaver"
          key: "token"
---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-token
  namespace: multimediasaver

spec:
  refreshInterval: "1m"

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: dockerhub-secrets
    creationPolicy: Owner
    template:
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: |
            {
              "auths": {
                "https://index.docker.io/v1/": {
                  "username": "{{ .dockerUsername }}",
                  "password": "{{ .dockerToken }}"
                }
              }
            }    
  data:
    - secretKey: dockerToken
      remoteRef:
        key: "docker"
        property: "docker-token"

    - secretKey: dockerUsername
      remoteRef:
        key: "docker"
        property: "docker-username"





---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: dockerhub-service-account
  namespace: multimediasaver
imagePullSecrets:
  - name: dockerhub-secrets
